name: Build Android APK
on: {workflow_dispatch: {}, push: {paths: ['android/**', '.github/workflows/android.yml']}}
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle -p android assembleRelease lintRelease
      - run: |
          mkdir artifact
          cp android/build/outputs/apk/release/*-unsigned.apk artifact/NotoNotes-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" artifact/
      - uses: actions/upload-artifact@v4
        with: {name: android-release-tools, path: artifact/}
