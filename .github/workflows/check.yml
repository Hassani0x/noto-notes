name: Check Noto Notes
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: docker build -t noto-writing .
  iphone:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode and compile tests
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcodebuild build-for-testing -project NotoNotes.xcodeproj -scheme NotoNotes -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/NotoBuild" CODE_SIGNING_ALLOWED=NO
      - name: Select simulator and test
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes
          DEVICE=$(xcrun simctl create NotoCI com.apple.CoreSimulator.SimDeviceType.iPhone-16e com.apple.CoreSimulator.SimRuntime.iOS-26-2)
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          node ci/fixture.mjs &
          xcodebuild test-without-building -derivedDataPath "$RUNNER_TEMP/NotoBuild" -project NotoNotes.xcodeproj -scheme NotoNotes -destination "id=$DEVICE" -parallel-testing-enabled NO -resultBundlePath NotoTests.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-test-results
          path: NotoTests.xcresult
