name: Check Noto Notes
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: docker build -t noto-writing .
  iphone:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode and compile tests
        run: |
          XCODE=$(python3 -c 'import glob,re; paths=glob.glob("/Applications/Xcode_*.app"); print(max(paths,key=lambda p:tuple(map(int,re.findall(r"[0-9]+",p)))))')
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild build-for-testing -project NotoNotes.xcodeproj -scheme NotoNotes -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/NotoBuild" CODE_SIGNING_ALLOWED=NO
      - name: Select simulator and test
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project NotoNotes.xcodeproj -scheme NotoNotes -showdestinations | tee "$RUNNER_TEMP/destinations"
          DEVICE=$(python3 - "$RUNNER_TEMP/destinations" <<'PY'
          import re, sys
          lines = [line for line in open(sys.argv[1]) if "platform:iOS Simulator" in line and "name:iPhone" in line]
          lines.sort(key=lambda line: ("iPhone SE" not in line, "Pro Max" in line))
          print(re.search(r"id:([0-9A-Fa-f-]{36})", lines[0]).group(1))
          PY
          )
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          node ci/fixture.mjs &
          xcodebuild test-without-building -derivedDataPath "$RUNNER_TEMP/NotoBuild" -project NotoNotes.xcodeproj -scheme NotoNotes -destination "id=$DEVICE" -parallel-testing-enabled NO -resultBundlePath NotoTests.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-test-results
          path: NotoTests.xcresult
